{% extends "base.html" %}

{% block content %}
    <h3>All cars of {{ driver.first_name }} {{ driver.last_name }}</h3>
      {% if cars %}
      <ul>
        {% for car in cars %}
          <li>{{ car.model }}</li>
        {% endfor %}
      </ul>
    {% else %}
      <p>There are no cars</p>
    {% endif %}

{% endblock %}
