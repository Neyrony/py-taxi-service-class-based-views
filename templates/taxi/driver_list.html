{% extends "base.html" %}

{% block content %}
  {% if driver_list %}
    <ul>
    {% for driver in driver_list %}
      <li>
        <span>{{ driver.id }}</span>
        <a href={{ driver.get_absolute_url }}> {{ driver.username }}</a>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>There are no drivers</p>
  {% endif %}
{% endblock %}
