{% extends "base.html" %}

{% block content %}
  <h3>Car list</h3>
  {% if car_list%}
    <ul>
    {% for car in car_list %}
      <li>
        <a href={{ car.get_absolute_url }}> {{ car.id }}</a>
      <span>. {{ car.model }}, was made in {{ car.manufacturer }} manufacturer</span>
      </li>
    {% endfor %}
    </ul>
  {% else %}
    <p>There are no cars</p>
  {% endif %}

{% endblock %}
